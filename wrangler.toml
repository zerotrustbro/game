name = "zerotrustbro-game"
main = "worker/index.js"
compatibility_date = "2025-07-18"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "POKI_ROOMS"
class_name = "PokiRoom"

[[durable_objects.bindings]]
name = "XO_ROOMS"
class_name = "XoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PokiRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["XoRoom"]
deleted_classes = ["AccountStore"]

[observability]
enabled = false
